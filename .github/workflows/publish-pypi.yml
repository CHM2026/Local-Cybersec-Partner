# Publication sur PyPI avec un token API stocké dans le secret GitHub
# `PYPI_API_TOKEN` (Settings → Secrets and variables → Actions).
# Créer le token sur https://pypi.org/manage/account/token/ :
#   pour la première publication, choisir la portée « Tous les projets »
#   (le projet n'existe pas encore sur PyPI au moment du premier envoi).
# Une fois le projet créé, remplacer par un token limité au projet
# `local-cybersec-partner`.
# Voir docs/RELEASE.md, section « Publication sur PyPI ».

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (ex : v1.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Construire et publier sur PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - name: Configurer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"

      - name: Vérifier la version du tag
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          if [ -n "$TAG" ] && [ "$TAG" != "v$VERSION" ]; then
            echo "Le tag $TAG ne correspond pas à la version $VERSION du dépôt." >&2
            exit 1
          fi
          echo "Publication de la version $VERSION"

      - name: Installer les outils de construction
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Construire le wheel et le sdist
        run: python -m build

      - name: Vérifier les métadonnées
        run: python -m twine check dist/*

      - name: Vérifier le token PyPI
        shell: bash
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "Secret PYPI_API_TOKEN absent : créer un token sur https://pypi.org/manage/account/token/ puis l'ajouter dans Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          echo "Token PyPI présent."

      - name: Publier sur PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
