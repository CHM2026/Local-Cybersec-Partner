# Construit le wheel et l'ajoute automatiquement à la Release GitHub.
# Déclenché à la publication d'une Release, ou manuellement pour un tag existant.
# Le paquet est pur Python (py3-none-any) : un seul build suffit pour tous les OS.

name: Release wheel

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la Release à compléter (ex : v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  wheel:
    name: Construire et joindre le wheel
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - name: Configurer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.dev.txt
            pyproject.toml

      - name: Installer les dépendances de build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.dev.txt

      - name: Construire le wheel
        run: python -m build --wheel

      - name: Contrôler le contenu du wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, f"Attendu 1 wheel, trouvé {wheels}"
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
          assert "main.py" in names, "main.py absent du wheel"
          assert any(n.startswith("src/") for n in names), "paquet src absent"
          print("Wheel valide :", wheels[0])
          PY

      - name: Joindre le wheel à la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl --clobber
