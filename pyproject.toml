[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-cybersec-partner"
version = "1.1.0"
description = "Tableau de bord local d'outils de cybersecurite (PySide6)"
requires-python = ">=3.15"
dependencies = [
    "PySide6>=6.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "build>=1.2",
    "pyinstaller>=6.10",
]

[project.scripts]
cybersec-dashboard = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
