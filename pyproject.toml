[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-cybersec-partner"
version = "1.1.0"
description = "Tableau de bord local d'outils de cybersecurite (PySide6)"
readme = {file = "docs/PYPI_README.md", content-type = "text/markdown"}
requires-python = ">=3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "CHM2026"}]
keywords = ["cybersecurity", "pyside6", "gui", "offline", "dashboard"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security",
]
dependencies = [
    "PySide6>=6.12",
]

[project.urls]
Homepage = "https://github.com/CHM2026/Local-Cybersec-Partner"
Repository = "https://github.com/CHM2026/Local-Cybersec-Partner"
Issues = "https://github.com/CHM2026/Local-Cybersec-Partner/issues"
Changelog = "https://github.com/CHM2026/Local-Cybersec-Partner/blob/main/CHANGELOG.md"
Releases = "https://github.com/CHM2026/Local-Cybersec-Partner/releases"

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "build>=1.2",
    "pyinstaller>=6.10",
]

[project.scripts]
cybersec-dashboard = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
